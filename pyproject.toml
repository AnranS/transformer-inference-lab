[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mini-transformer"
version = "0.1.0"
description = "Transformer inference lab: build from tokenizer to GPT-2"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.2",
    "transformers>=4.40",
    "tokenizers>=0.19",
]

# uv sync 默认安装 dev 组，不用额外加参数。
# 注意：uv sync 会卸载所有未在此声明的包，手动装的工具要写进来才不会被清掉。
[dependency-groups]
dev = [
    "pytest>=8",
    "ipykernel>=6",  # experiments/ 下的 notebook 需要
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
